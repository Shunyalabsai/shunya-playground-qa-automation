name: Scheduled Playground Tests (Cloud Backup)

on:
  # Runs twice daily:
  # 1. 22:30 UTC = 04:00 AM IST (Morning Run)
  # 2. 11:30 UTC = 05:00 PM IST (Evening Run)
  schedule:
    - cron: '30 22 * * *'
    - cron: '30 11 * * *'
  # Allow Google Apps Script dispatch trigger
  repository_dispatch:
    types: [scheduled_daily_run, playground_run, meera_scheduled_run]
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      suite:
        description: 'Select test suite to execute'
        required: true
        default: 'smoke'
        type: choice
        options:
          - 'smoke'
          - 'all'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Restore auth state from secret
        run: |
          mkdir -p auth
          echo "${{ secrets.PLAYGROUND_AUTH_JSON_B64 }}" | base64 -d > auth/playground-auth.json
          if [ ! -s auth/playground-auth.json ]; then
            echo "::error::PLAYGROUND_AUTH_JSON_B64 secret is missing or empty"
            exit 1
          fi

      - name: Write .env from secrets
        run: |
          cat > .env <<EOF
          ASR_API_KEY=${{ secrets.ASR_API_KEY }}
          ASR_BASE_URL=${{ secrets.ASR_BASE_URL }}
          ASR_BASE_URL_ROOT=${{ secrets.ASR_BASE_URL_ROOT }}
          SMTP_HOST=${{ secrets.SMTP_HOST }}
          SMTP_PORT=${{ secrets.SMTP_PORT }}
          SMTP_USER=${{ secrets.SMTP_USER }}
          SMTP_PASS=${{ secrets.SMTP_PASS }}
          REPORT_EMAIL_FROM=${{ secrets.REPORT_EMAIL_FROM }}
          REPORT_EMAIL_TO=${{ secrets.REPORT_EMAIL_TO }}
          REPORT_BASE_URL=https://yamini-pal-singh.github.io/playground-testing
          GOOGLE_SHEET_ID=${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON=${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
          EOF

      - name: Run Test Suite
        id: tests
        continue-on-error: true
        run: |
          if [ "${{ github.event.inputs.suite }}" = "all" ]; then
            echo "🚀 Running Full Exhaustive Suite (151 Scenarios)..."
            npm test || true
          else
            echo "🚀 Running Smoke Test Suite (21 Scenarios)..."
            npm run test:smoke || true
          fi

      - name: Generate HTML reports
        if: always()
        run: |
          npx ts-node scripts/generate-playground-report.ts
          npx ts-node scripts/generate-stakeholder-dashboard.ts

      - name: Read summary stats
        if: always()
        id: stats
        run: |
          python3 -c "
          import json, os
          runs_file = 'reports/playground-runs.json'
          failed = 0
          passed = 0
          total = 0
          if os.path.exists(runs_file):
              try:
                  data = json.load(open(runs_file))
                  if isinstance(data, list) and len(data) > 0:
                      latest = data[0]
                      failed = latest.get('failedTests', latest.get('summary', {}).get('failed', 0))
                      passed = latest.get('passedTests', latest.get('summary', {}).get('passed', 0))
                      total = latest.get('totalTests', latest.get('summary', {}).get('total', 0))
              except Exception as e:
                  print('Error reading runs:', e)
          print(f'Stats: passed={passed}, failed={failed}, total={total}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'failed={failed}\npassed={passed}\ntotal={total}\n')
          "

      - name: Commit and push dashboard
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git stash || true
          git pull origin main --rebase || true
          git stash pop 2>/dev/null || true
          git add index.html docs/index.html .nojekyll reports/Stakeholder-Dashboard.html reports/Playground-Report.html reports/playground-runs.json reports/playground-summary-*.json reports/playground-today-summary.json 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "Cloud run dashboard update — $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push origin main || true
            if [ -n "${{ secrets.SECONDARY_REPO_TOKEN }}" ]; then
              git push https://${{ secrets.SECONDARY_REPO_TOKEN }}@github.com/Shunyalabsai/shunya-playground-qa-automation.git main 2>/dev/null || true
            fi
          else
            echo "No changes to commit"
          fi

      - name: Send email on failure
        if: always() && steps.stats.outputs.failed != '0'
        run: npx ts-node scripts/send-playground-email.ts

      - name: Clean up sensitive files
        if: always()
        run: |
          rm -f .env
          rm -rf auth
